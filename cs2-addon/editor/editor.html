<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor de edificios CS2</title>
<style>
:root{--bg:#16181c;--pn:#1f2227;--pn2:#262a31;--ln:#343942;--tx:#e9ecf1;--mu:#98a0ab;--ac:#4ea1ff;--ac2:#2b6fc0;--ok:#4cc38a;--bad:#ef6a5e;--warn:#f0b04a;--r:8px}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;grid-template-rows:46px 1fr 28px;grid-template-columns:54px 1fr 350px;grid-template-areas:"top top top" "tools main side" "bot bot bot";overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{background:var(--pn2);border:1px solid var(--ln);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{border-color:#566}button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--ac);border-color:var(--ac);color:#04121f;font-weight:600}button.pri:hover{background:#6bb2ff}
button.on{background:var(--ac2);border-color:var(--ac)}
button.ghost{background:transparent;border-color:transparent}button.ghost:hover{background:var(--pn2)}
select,input[type=number],input[type=text]{background:#14161a;border:1px solid var(--ln);border-radius:6px;padding:5px 7px;min-width:0}
input[type=number]{width:72px}
#top{grid-area:top;background:var(--pn);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:6px;padding:0 10px}
#top .logo{font-weight:700;letter-spacing:.02em;margin-right:8px}#top .logo b{color:var(--ac)}
#top .sp{flex:1}.dot{width:9px;height:9px;border-radius:50%;background:var(--bad);display:inline-block;margin-right:6px}.dot.ok{background:var(--ok)}.dot.busy{background:var(--warn)}
#tools{grid-area:tools;background:var(--pn);border-right:1px solid var(--ln);display:flex;flex-direction:column;gap:4px;padding:8px 5px;align-items:center}
.tool{width:42px;height:42px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:9.5px;color:var(--mu);background:transparent;border-color:transparent}
.tool svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tool:hover{background:var(--pn2);color:var(--tx)}.tool.on{background:var(--ac2);color:#fff;border-color:var(--ac)}
.sep{width:30px;height:1px;background:var(--ln);margin:4px 0}
#main{grid-area:main;display:grid;grid-template-columns:1fr 1fr;position:relative;min-width:0;min-height:0}
#main.v-plan{grid-template-columns:1fr 0}#main.v-3d{grid-template-columns:0 1fr}
.vp{position:relative;min-width:0;min-height:0;overflow:hidden}.vp canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#planvp{border-right:1px solid var(--ln);background:#111317}
.vlabel{position:absolute;left:10px;top:8px;font-size:11px;color:var(--mu);pointer-events:none;text-transform:uppercase;letter-spacing:.06em}
.vbtns{position:absolute;right:8px;top:6px;display:flex;gap:4px}.vbtns button{padding:3px 8px;font-size:11.5px;background:#1f2227cc}
#hint{position:absolute;left:10px;bottom:8px;right:10px;font-size:12px;color:var(--mu);pointer-events:none;text-shadow:0 1px 3px #000}
#hint b{color:var(--tx)}
#side{grid-area:side;background:var(--pn);border-left:1px solid var(--ln);overflow:auto}
.sec{border-bottom:1px solid var(--ln);padding:10px 12px}.sec h3{margin:0 0 8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--mu);display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}.row>label{flex:1;color:var(--mu)}.row.wrap{flex-wrap:wrap}
.seg{display:flex}.seg button{border-radius:0;margin-left:-1px;padding:5px 9px}.seg button:first-child{border-radius:6px 0 0 6px;margin:0}.seg button:last-child{border-radius:0 6px 6px 0}
.sw{width:20px;height:20px;border-radius:5px;border:1px solid #0006;display:inline-block;vertical-align:middle}
.matbtn{display:flex;align-items:center;gap:6px;padding:5px 8px}
.pick{display:flex;gap:8px;align-items:center;width:100%;text-align:left;padding:4px 6px}.pick img{width:40px;height:40px;border-radius:5px;object-fit:cover;background:#0004}.pick span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cat{display:none;position:absolute;left:0;right:0;bottom:0;height:172px;background:#1f2227f5;border-top:1px solid var(--ln);z-index:5;flex-direction:column}
#cat.show{display:flex}#cat header{padding:8px 12px 4px;display:flex;gap:10px;align-items:center}#cat header b{font-size:12px}#cat header input{width:200px}
#cat .grid{display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;padding:2px 12px 10px;flex:1;min-height:0}
.card{flex:0 0 86px;background:var(--pn2);border:1px solid var(--ln);border-radius:7px;padding:3px;cursor:pointer;text-align:center;font-size:10px;line-height:1.2;color:var(--mu);overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;height:78px;object-fit:cover;border-radius:4px;display:block;background:#0004;flex:none}.card:hover{border-color:#789}.card.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac);color:var(--tx)}
.card div{overflow:hidden;margin-top:3px;flex:1}
#main.catopen #hint{bottom:180px}
#guide{display:flex;gap:2px;background:#14161a;border:1px solid var(--ln);border-radius:20px;padding:3px}
#guide button{border:0;background:transparent;border-radius:16px;padding:4px 11px;color:var(--mu);font-size:12.5px}#guide button b{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:#2c313a;margin-right:6px;font-size:11px;text-align:center;color:var(--tx)}
#guide button:hover{color:var(--tx)}#guide button.on{background:var(--ac2);color:#fff}#guide button.on b{background:#fff;color:var(--ac2)}
.tabs{display:flex;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--pn);z-index:2}.tabs button{flex:1;border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;padding:10px 2px;color:var(--mu);font-size:12px;white-space:nowrap}
.tabs button.on{color:var(--tx);border-bottom-color:var(--ac)}.tabs button:hover{color:var(--tx)}
.vnav{position:absolute;right:8px;bottom:8px;display:flex;gap:3px;z-index:3}.vnav button{padding:3px 8px;font-size:11.5px;background:#1f2227cc}
#sted{display:none;position:absolute;left:10px;top:44px;bottom:10px;width:300px;background:#1f2227f5;border:1px solid var(--ln);border-radius:10px;z-index:7;flex-direction:column;box-shadow:0 10px 30px #0008}#sted.show{display:flex}
#sted header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 4px}.stbody{overflow:auto;padding:0 12px 12px;flex:1;min-height:0}
.tabs{overflow-x:auto}.tabs button{flex:none!important;padding:10px 9px!important}
#tip{position:absolute;pointer-events:none;display:none;background:#000d;border:1px solid var(--ln);padding:4px 9px;border-radius:6px;font-size:12px;z-index:6;white-space:nowrap}
#welcome{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:4;background:radial-gradient(#1c2026ee,#111317f5)}#welcome.show{display:flex}
#welcome .card2{max-width:760px;text-align:center}#welcome h1{font-size:24px;margin:0 0 6px}#welcome p{color:var(--mu);margin:0 0 22px}
.shapes{display:grid;grid-template-columns:repeat(4,150px);gap:12px;justify-content:center}
.shape{background:var(--pn2);border:1px solid var(--ln);border-radius:12px;padding:14px 10px 10px;cursor:pointer;color:var(--tx)}.shape:hover{border-color:var(--ac);background:#2a303a}
.shape svg{width:100%;height:70px;fill:#4ea1ff33;stroke:#7fb7ff;stroke-width:2.5;stroke-linejoin:round}.shape div{margin-top:8px;font-size:13px}
.steps{display:flex;gap:18px;justify-content:center;margin-top:26px;color:var(--mu);font-size:12.5px}.steps span b{color:var(--tx)}
.kt{width:100%;border-collapse:collapse}.kt td{padding:4px 6px;border-bottom:1px solid var(--ln)}.kt td:first-child{white-space:nowrap}
.comp{border:1px solid var(--ln);border-radius:8px;margin:6px 0;padding:0 10px 6px;background:#1b1e23}.comp summary{cursor:pointer;padding:9px 0;font-weight:600;list-style:none}.comp summary::before{content:'▸ ';color:var(--mu)}.comp[open] summary::before{content:'▾ '}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.fc{background:var(--pn2);border:1px solid var(--ln);border-radius:8px;padding:4px;cursor:pointer;text-align:center;font-size:12px}.fc:hover{border-color:var(--ac)}.fc img{width:100%;aspect-ratio:8/9;object-fit:cover;border-radius:5px;background:#0004;display:block}.fc div{margin:4px 0 2px}
.gtitle{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:10px 0 2px}
.wlist button{display:flex;justify-content:space-between;width:100%;margin:3px 0;text-align:left}
#bot{grid-area:bot;background:var(--pn);border-top:1px solid var(--ln);display:flex;align-items:center;gap:18px;padding:0 12px;color:var(--mu);font-size:12px}#bot b{color:var(--tx);font-weight:600}
.bar{width:120px;height:6px;border-radius:3px;background:#0005;display:inline-block;vertical-align:middle;margin-left:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:#000c;border:1px solid var(--ln);padding:8px 14px;border-radius:8px;display:none;z-index:20;max-width:70vw}
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:30}#modal.show{display:flex}
#modal .box{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:18px;width:460px;max-width:92vw}#modal h2{margin:0 0 10px;font-size:16px}
.hintline{color:var(--mu);font-size:12px}.kbd{border:1px solid var(--ln);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px;color:var(--tx)}
.empty{padding:22px 12px;color:var(--mu);text-align:center}.empty b{color:var(--tx)}
.spin{display:none;margin-left:8px;width:14px;height:14px;border:2px solid var(--ln);border-top-color:var(--ac);border-radius:50%;animation:sp .7s linear infinite}.spin.on{display:inline-block}@keyframes sp{to{transform:rotate(360deg)}}
</style></head><body>
<div id="top">
  <span class="logo">Editor <b>CS2</b></span>
  <button id="bUndo" title="Deshacer (Ctrl+Z)">↶</button><button id="bRedo" title="Rehacer (Ctrl+Y)">↷</button>
  <span style="width:8px"></span>
  
  <button id="bNew" title="Empezar un edificio nuevo">Nuevo</button><button id="bOpen">Abrir</button><button id="bSave">Guardar</button>
  <span class="sp"></span>
  <div id="guide"></div>
  <span class="sp"></span>
  <button id="bHelp" title="Atajos y ayuda (?)">?</button>
  <span id="eng"><span class="dot" id="dot"></span><span id="engtxt">Motor…</span></span><span class="spin" id="spin"></span>
  <button class="pri" id="bExport" style="margin-left:10px">Exportar a CS2</button>
</div>
<div id="tools"></div>
<div id="main" class="">
  <div class="vp" id="planvp"><canvas id="plan"></canvas><span class="vlabel">Planta</span></div>
  <div class="vp" id="v3vp"><canvas id="v3"></canvas><span class="vlabel">Vista 3D</span>
    <div class="vnav" id="vnav"><button data-az="-1.5708">Frente</button><button data-az="0">Derecha</button><button data-az="1.5708">Atrás</button><button data-az="3.1416">Izquierda</button><button data-az="top">Arriba</button></div>
    <div class="vbtns"><button id="bRoof" class="on" title="Mostrar u ocultar el techo">Techo</button><button id="bFit" title="Centrar la vista">Centrar</button>
      <span class="seg"><button data-v="plan">Planta</button><button data-v="both" class="on">Ambas</button><button data-v="3d">3D</button></span></div>
  </div>
  <div id="cat"><header><b id="catTitle">Catálogo</b><input type="text" id="catQ" placeholder="Buscar…"><span style="flex:1"></span><button class="ghost" id="catX">✕ Cerrar</button></header><div class="grid" id="catGrid"></div></div>
  <div id="hint"></div><div id="tip"></div>
  <div id="sted"></div>
  <div id="welcome"></div>
</div>
<div id="side"></div>
<div id="bot"></div>
<div id="toast"></div>
<div id="modal"><div class="box" id="mbox"></div></div>
<input type="file" id="file" accept=".json" style="display:none">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<script type="module" src="editor.js"></script>
</body></html>
